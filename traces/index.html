<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Live prediction traces</title>
<style>
:root{--ink:#17202a;--muted:#667085;--line:#d9e0e7;--bg:#f4f6f8;--nav:#17212b;--blue:#1769aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:var(--nav);color:white;padding:14px 18px}h1{margin:0 0 12px;font-size:19px}.controls{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr)) auto;gap:9px}label{display:grid;gap:4px;color:#cbd5e1;font-size:11px;font-weight:700}select,button{min-height:36px;border-radius:5px;padding:6px 9px}select{color:white;background:#263442;border:1px solid #526171}button{align-self:end;border:0;background:var(--blue);color:white;font-weight:700}main{max-width:1500px;margin:auto;padding:14px}.status,.panel{background:white;border:1px solid var(--line);border-radius:6px}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-bottom:12px}.metric{background:white;padding:10px}.key{color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.value{margin-top:4px;font:13px ui-monospace,monospace;overflow-wrap:anywhere}.layout{display:grid;grid-template-columns:290px 1fr;gap:12px}.panel h2{font-size:13px;margin:0;padding:10px;border-bottom:1px solid var(--line)}#samples{padding:8px;display:grid;gap:6px}.sample{width:100%;text-align:left;color:var(--ink);background:white;border:1px solid var(--line)}.sample.active{border-color:var(--blue);box-shadow:inset 3px 0 var(--blue)}#detail{padding:10px;min-width:0}.stage{border:1px solid var(--line);margin-bottom:8px}.stage summary{cursor:pointer;padding:9px;background:#f7f9fb;font-weight:750}.block{padding:10px;border-top:1px solid var(--line)}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}.hint{color:var(--muted);font-size:12px}.bad{color:#b42318}.good{color:#087a55}@media(max-width:800px){.controls,.status,.layout{grid-template-columns:1fr}.layout{display:block}.panel{margin-bottom:12px}}
</style>
</head>
<body>
<header><h1>Live prediction traces</h1><div class="controls">
<label>Dataset<select id="dataset"></select></label>
<label>Method<select id="method"></select></label>
<label>Date and time<select id="run"></select></label>
<button id="refresh">Refresh</button>
</div></header>
<main><section id="status" class="status"></section><div class="layout">
<aside class="panel"><h2>Pilot samples</h2><div id="samples"></div></aside>
<section class="panel"><h2>Prompt and reasoning chain</h2><div id="detail" class="hint">Select a sample.</div></section>
</div></main>
<script>
const qs=new URLSearchParams(location.search);
const DATA=(qs.get('data')||'https://raw.githubusercontent.com/jiosephlee/jiosephlee.github.io/live-traces/traces-data').replace(/\/$/,'');
const $=id=>document.getElementById(id), els={dataset:$('dataset'),method:$('method'),run:$('run'),refresh:$('refresh'),status:$('status'),samples:$('samples'),detail:$('detail')};
let catalog=[],current=null,selected='';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(path){const r=await fetch(`${DATA}/${path}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${path}`);return r.json()}
function options(values,selected){return values.map(v=>`<option value="${esc(v)}"${v===selected?' selected':''}>${esc(v)}</option>`).join('')}
function populate(){const d=els.dataset.value||catalog[0]?.dataset||'';els.dataset.innerHTML=options([...new Set(catalog.map(x=>x.dataset))],d);const methods=[...new Set(catalog.filter(x=>x.dataset===els.dataset.value).map(x=>x.method))];const m=methods.includes(els.method.value)?els.method.value:methods[0];els.method.innerHTML=options(methods,m);const runs=catalog.filter(x=>x.dataset===els.dataset.value&&x.method===els.method.value).sort((a,b)=>b.run_id.localeCompare(a.run_id));const id=runs.some(x=>x.run_id===els.run.value)?els.run.value:runs[0]?.run_id;els.run.innerHTML=options(runs.map(x=>x.run_id),id)}
async function load(){try{const old=current;catalog=(await json('catalog.json')).runs||[];populate();const row=catalog.find(x=>x.dataset===els.dataset.value&&x.method===els.method.value&&x.run_id===els.run.value);if(!row)return;current=await json(`${row.path}/run.json`);render();if(old?.updated_at!==current.updated_at&&selected)await sample(selected)}catch(e){els.detail.innerHTML=`<p class="bad">${esc(e.message)}</p>`}}
function metric(k,v){return `<div class="metric"><div class="key">${esc(k)}</div><div class="value">${esc(v)}</div></div>`}
function render(){els.status.innerHTML=metric('status',current.status)+metric('dataset',current.dataset)+metric('method',current.method)+metric('updated',current.updated_at);const names=Object.keys(current.samples||{}).sort();els.samples.innerHTML=names.length?names.map(x=>`<button class="sample${x===selected?' active':''}" data-id="${esc(x)}">${esc(x)}<br><span class="hint">${(current.samples[x]||[]).length} stages</span></button>`).join(''):'<p class="hint">Waiting for the first response…</p>';els.samples.querySelectorAll('button').forEach(b=>b.onclick=()=>sample(b.dataset.id));if(!selected&&names.length)sample(names[0]);}
async function sample(id){selected=id;render();const stages=current.samples[id]||[];const rows=await Promise.all(stages.map(stage=>json(`${current.path}/samples/${id}/${stage}.json`)));els.detail.innerHTML=`<p class="hint">Cancel: <code>python -m predict.live cancel ${esc(current.path)}</code> · Continue: <code>python -m predict.live continue ${esc(current.path)}</code></p>`+rows.map((row,i)=>`<details class="stage"${i===rows.length-1?' open':''}><summary>${esc(row.stage)}</summary><div class="block"><div class="key">Input prompt</div><pre>${esc(row.input_prompt||'')}</pre></div><div class="block"><div class="key">Model response and reasoning</div><pre>${esc(JSON.stringify(row.llm||{},null,2))}</pre></div></details>`).join('')}
els.dataset.onchange=()=>{els.method.value='';els.run.value='';selected='';populate();load()};els.method.onchange=()=>{els.run.value='';selected='';populate();load()};els.run.onchange=()=>{selected='';load()};els.refresh.onclick=load;load();setInterval(load,5000);
</script>
</body></html>
